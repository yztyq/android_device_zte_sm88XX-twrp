      - name: Build TWRP phase 1 (soong analysis, m nothing)
        run: |
          set -e
          mkdir -p artifacts
          export USE_CCACHE=0
          export SOONG_UI_NINJA_ARGS="-j1"
          # soong_build / soong_ui 是 Go 程序：限住堆峰值、减少并行解析线程，
          # 宁可多花 CPU 做 GC，也不要在解析 Android.bp 时把内存冲到 15Gi。
          export GOMEMLIMIT=6GiB
          export GOGC=60
          export GOMAXPROCS=2
          echo "nproc=$(nproc) cgroup=$(stat -fc %T /sys/fs/cgroup)"
          source build/envsetup.sh
          lunch "twrp_${{ github.event.inputs.LUNCH_TARGET }}"
          sudo apt-get install -y kmod
          mkdir -p out/host/linux-x86/bin
          DEPMOD_BIN="$(command -v depmod || echo /usr/sbin/depmod)"
          ln -sf "${DEPMOD_BIN}" out/host/linux-x86/bin/depmod
          echo "Seeded host depmod from ${DEPMOD_BIN}"
          {
            echo "=== phase 1: soong analysis (m nothing) at $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            df -h
            free -h
            m -j1 nothing &
            build_pid=$!
            (
              while kill -0 "${build_pid}" 2>/dev/null; do
                echo "Build heartbeat at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                free -h | sed -n '1,3p'
                echo "top mem:"
                ps -eo pid,rss,pcpu,comm --sort=-rss | head -6
                echo "children of build:"
                ps --ppid "${build_pid}" -o pid,rss,pcpu,comm 2>/dev/null || true
                echo -n "cgroup peak="; cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a
                echo -n "oom events: "; cat /sys/fs/cgroup/memory.events 2>/dev/null | tr '\n' ' ' || true; echo
                df -h / | tail -1
                sleep 30
              done
            ) &
            heartbeat_pid=$!
            set +e
            wait "${build_pid}"
            build_status=$?
            kill "${heartbeat_pid}" 2>/dev/null || true
            wait "${heartbeat_pid}" 2>/dev/null || true
            set -e
            test "${build_status}" -eq 0
            echo "=== phase 1 done at $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            df -h
            free -h
          } 2>&1 | tee artifacts/build-phase1.log
          test "${PIPESTATUS[0]}" -eq 0
          ls -l build.ninja out/build.ninja 2>/dev/null || true

      - name: Build TWRP phase 2 (compile recoveryimage)
        run: |
          set -e
          mkdir -p artifacts
          export USE_CCACHE=0
          export SOONG_UI_NINJA_ARGS="-j1"
          # soong_build / soong_ui 是 Go 程序：限住堆峰值、减少并行解析线程，
          # 宁可多花 CPU 做 GC，也不要在解析 Android.bp 时把内存冲到 15Gi。
          export GOMEMLIMIT=6GiB
          export GOGC=60
          export GOMAXPROCS=2
          echo "nproc=$(nproc) cgroup=$(stat -fc %T /sys/fs/cgroup)"
          source build/envsetup.sh
          lunch "twrp_${{ github.event.inputs.LUNCH_TARGET }}"
          {
            echo "=== phase 2: compile ${{ github.event.inputs.BUILD_PARTITION }}image at $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            df -h
            free -h
            m -j1 "${{ github.event.inputs.BUILD_PARTITION }}image" &
            build_pid=$!
            (
              while kill -0 "${build_pid}" 2>/dev/null; do
                echo "Build heartbeat at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                free -h | sed -n '1,3p'
                echo "top mem:"
                ps -eo pid,rss,pcpu,comm --sort=-rss | head -6
                echo "children of build:"
                ps --ppid "${build_pid}" -o pid,rss,pcpu,comm 2>/dev/null || true
                echo -n "cgroup peak="; cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a
                echo -n "oom events: "; cat /sys/fs/cgroup/memory.events 2>/dev/null | tr '\n' ' ' || true; echo
                df -h / | tail -1
                sleep 30
              done
            ) &
            heartbeat_pid=$!
            set +e
            wait "${build_pid}"
            build_status=$?
            kill "${heartbeat_pid}" 2>/dev/null || true
            wait "${heartbeat_pid}" 2>/dev/null || true
            set -e
            test "${build_status}" -eq 0
            echo "=== phase 2 done at $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            df -h
            free -h
          } 2>&1 | tee artifacts/build.log
          test "${PIPESTATUS[0]}" -eq 0
          cp "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_PARTITION }}.img" \
             "artifacts/TWRP-4.0.0-16-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_PARTITION }}-${{ github.run_id }}.img"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-build-log-${{ github.run_id }}
          path: artifacts/build*.log

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-4.0.0-16-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_PARTITION }}-${{ github.run_id }}
          path: artifacts/*.img

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_PARTITION }}-${{ github.run_id }}
          name: TWRP 4.0.0-16 ${{ github.event.inputs.DEVICE_NAME }} ${{ github.event.inputs.BUILD_PARTITION }} ${{ github.run_id }}
          files: artifacts/*.img
