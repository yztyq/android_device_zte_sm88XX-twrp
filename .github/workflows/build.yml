name: TWRP 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: TWRP manifest URL
        default: https://github.com/TWRP-Test/platform_manifest_twrp_aosp
        required: true
      TWRP_MANIFEST_BRANCH:
        description: TWRP manifest branch
        default: twrp-16.0
        required: true
      DEVICE_PATH:
        description: Device tree path under device/
        default: zte/sm88XX
        required: true
      DEVICE_NAME:
        description: Device codename
        default: sm88XX
        required: true
      LUNCH_TARGET:
        description: Lunch suffix after twrp_
        default: sm88XX-aosp_current-eng
        required: true
      BUILD_PARTITION:
        description: Build target without image suffix
        default: recovery
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Show build info
        run: |
          echo "Device path: device/${{ github.event.inputs.DEVICE_PATH }}"
          echo "Lunch: twrp_${{ github.event.inputs.LUNCH_TARGET }}"
          echo "Build target: ${{ github.event.inputs.BUILD_PARTITION }}image"
          echo "Run: ${{ github.run_id }}"
          df -h

      - name: Cleanup
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/share/google-cloud-sdk \
            /usr/lib/jvm \
            /opt/az \
            /opt/microsoft \
            /opt/pipx \
            /usr/local/share/chromium \
            /usr/local/share/edge_driver \
            /usr/local/share/gecko_driver \
            /usr/local/share/phantomjs \
            /usr/local/share/selenium \
            /var/lib/gems \
            /var/cache/apt \
            "$HOME/.cache"
          docker system prune -af || true
          df -h
          root_size_gb="$(df -BG / | awk 'NR==2 {gsub("G","",$2); print $2}')"
          root_avail_gb="$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')"
          if [ "${root_size_gb}" -lt 120 ]; then
            echo "Runner root filesystem is too small for this TWRP build: ${root_size_gb}G total, ${root_avail_gb}G available."
            echo "Re-run the workflow until GitHub assigns a 145G runner."
            exit 1
          fi

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush python3 rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Setup swap
        run: |
          set -e
          AVAIL_G=$(df -Pk / | awk 'NR==2{print int($4/1024/1024)}')
          echo "Root filesystem free: ${AVAIL_G}G"
          df -h /
          # 分析阶段 soong_build 会有瞬时内存峰值，用 12G swap 兜底；
          # 不取 24G：磁盘仅剩 44G，swap 过大会把 out/ 可用空间压到 20G 以下（ENOSPC 风险）。
          SWAP=12G
          echo "Avail: ${AVAIL_G}G"
          echo "Swap size: ${SWAP}"
          sudo swapoff -a || true
          sudo fallocate -l "${SWAP}" /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl -w vm.swappiness=10
          free -h
          swapon --show || true
          df -h

      - name: Sync source
        run: |
          set -e
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u "${{ github.event.inputs.TWRP_MANIFEST_URL }}" -b "${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}"
          repo sync -c --force-sync --no-clone-bundle --no-tags -j4 &
          sync_pid=$!
          (
            while kill -0 "${sync_pid}" 2>/dev/null; do
              echo "Repo sync still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              sleep 300
            done
          ) &
          heartbeat_pid=$!
          set +e
          wait "${sync_pid}"
          sync_status=$?
          kill "${heartbeat_pid}" 2>/dev/null || true
          wait "${heartbeat_pid}" 2>/dev/null || true
          set -e
          test "${sync_status}" -eq 0

      - name: Restore wpa_supplicant source
        run: |
          set -e
          if [ ! -d external/wpa_supplicant_8 ]; then
            git clone --depth=1 --branch android-16.0.0_r1 \
              https://android.googlesource.com/platform/external/wpa_supplicant_8 \
              external/wpa_supplicant_8
          fi
          python3 - <<'PY'
          from pathlib import Path

          bp = Path("external/wpa_supplicant_8/wpa_supplicant/Android.bp")
          text = bp.read_text()
          marker = "wpa_supplicant_recovery"
          if marker not in text:
              text += r'''

          cc_binary {
              name: "wpa_cli_recovery",
              recovery: true,
              srcs: [
                  "wpa_cli.c",
                  "src/common/cli.c",
                  "src/common/wpa_ctrl.c",
                  "src/utils/common.c",
                  "src/utils/edit.c",
                  "src/utils/eloop.c",
                  "src/utils/os_unix.c",
                  "src/utils/wpa_debug.c",
              ],
              shared_libs: [
                  "libcutils",
                  "liblog",
              ],
              defaults: [
                  "wpa_supplicant_no_aidl_cflags_default",
                  "wpa_supplicant_includes_default",
              ],
          }

          cc_binary {
              name: "wpa_supplicant_recovery",
              recovery: true,
              shared_libs: [
                  "libc",
                  "libcrypto",
                  "libcutils",
                  "libkeystore-engine-wifi-hidl",
                  "liblog",
                  "libnl",
                  "libssl",
              ],
              defaults: [
                  "wpa_supplicant_srcs_default",
                  "wpa_supplicant_no_aidl_cflags_default",
                  "wpa_supplicant_includes_default",
              ],
          }
          '''
              bp.write_text(text)
          PY

      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: device/${{ github.event.inputs.DEVICE_PATH }}

      - name: Normalize line endings in device tree
        run: |
          set -e
          cd "device/${{ github.event.inputs.DEVICE_PATH }}"
          # Web-edited files can be saved with CRLF; sh/rc must be pure LF on device.
          find . -type f \( -name '*.sh' -o -name '*.rc' -o -name '*.xml' -o -name '*.conf' \
            -o -name '*.prop' -o -name '*.mk' -o -name '*.bp' -o -name '*.txt' \) -print0 \
            | xargs -0 -r sed -i 's/\r$//'
          echo "Files still containing CR after normalize:"
          grep -rlI "$(printf '\r')" . | sed 's/^/  /' || echo "  none"

      - name: Prepare nf binaries and assets
        run: |
          set -e
          D="device/${{ github.event.inputs.DEVICE_PATH }}/recovery/root/system/bin/nf"
          chmod 755 "$D"/*.sh
          # Magisk v31.1 assets come from the official APK, so no binaries live in the repo
          curl -sSL --retry 3 --retry-delay 2 -o /tmp/magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
          mkdir -p "$D/magisk" /tmp/m
          unzip -o -q -j /tmp/magisk.apk 'assets/boot_patch.sh' 'assets/util_functions.sh' -d "$D/magisk"
          unzip -o -q -j /tmp/magisk.apk 'lib/arm64-v8a/libmagisk.so' -d /tmp/m
          unzip -o -q -j /tmp/magisk.apk 'lib/arm64-v8a/libmagiskboot.so' -d /tmp/m
          unzip -o -q -j /tmp/magisk.apk 'lib/arm64-v8a/libmagiskinit.so' -d /tmp/m
          unzip -o -q -j /tmp/magisk.apk 'lib/arm64-v8a/libinit-ld.so' -d /tmp/m
          cp /tmp/m/libmagisk.so "$D/magisk/magisk"
          cp /tmp/m/libmagiskboot.so "$D/magisk/magiskboot"
          cp /tmp/m/libmagiskinit.so "$D/magisk/magiskinit"
          cp /tmp/m/libinit-ld.so "$D/magisk/init-ld"
          # payload-dumper-go: static linux/arm64 build runs on the device aarch64 kernel
          curl -sSL --retry 3 --retry-delay 2 -o /tmp/pdg.tar.gz \
            https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_arm64.tar.gz
          tar -xzf /tmp/pdg.tar.gz -C /tmp payload-dumper-go
          install -m 0755 /tmp/payload-dumper-go "$D/payload-dumper-go"
          chmod 755 "$D/magisk/"*
          echo "nf dir:"
          ls -l "$D" "$D/magisk"
      - name: Patch recovery touch input for NX809J
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          inp = Path("bootable/recovery/twrpminui/twrp_input.cpp")
          text = inp.read_text()
          old_key_block = (
              "\t// Handle keyboard events, value of 1 indicates key down, 0 indicates key up\n"
              "\tif (ev->type == EV_KEY) {\n"
              "\t\treturn 0;\n"
              "\t}\n"
          )
          new_key_block = (
              "\t// Handle keyboard events, value of 1 indicates key down, 0 indicates key up\n"
              "\tif (ev->type == EV_KEY) {\n"
              "\t\tif (ev->code == BTN_TOUCH || ev->code == BTN_TOOL_FINGER)\n"
              "\t\t\treturn 1;\n"
              "\t\treturn 0;\n"
              "\t}\n"
          )
          if old_key_block not in text:
              raise SystemExit("twrp_input.cpp key handling block not found")
          text = text.replace(old_key_block, new_key_block)
          old_scale_anchor = (
              "    const bool swap_axes = rotation == 90 || rotation == 270;\n"
          )
          new_scale_block = (
              "    if (p->xi.maximum > fb_width * 4 && p->yi.maximum > fb_height * 4 &&\n"
              "        p->x >= 0 && p->x < fb_width && p->y >= 0 && p->y < fb_height) {\n"
              "        *x = p->x;\n"
              "        *y = p->y;\n"
              "        return 0;\n"
              "    }\n"
              "\n"
              "    const bool swap_axes = rotation == 90 || rotation == 270;\n"
          )
          if old_scale_anchor not in text:
              raise SystemExit("twrp_input.cpp swap_axes anchor not found")
          text = text.replace(old_scale_anchor, new_scale_block)
          inp.write_text(text)
          PY

      - name: Patch recovery haptics for NX809J
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          hap = Path("bootable/recovery/twrpminui/haptics.cpp")
          text = hap.read_text()
          old = (
              '#define LEDS_HAPTICS_DURATION_FILE\t"/sys/class/leds/vibrator/duration"\n'
              '#define LEDS_HAPTICS_ACTIVATE_FILE\t"/sys/class/leds/vibrator/activate"\n'
          )
          new = (
              '#define LEDS_HAPTICS_DURATION_FILE\t"/sys/class/leds/zte_vibrator/duration_aw"\n'
              '#define LEDS_HAPTICS_ACTIVATE_FILE\t"/sys/class/leds/zte_vibrator/activate_aw"\n'
          )
          if old not in text:
              raise SystemExit("haptics.cpp LED haptics path block not found")
          hap.write_text(text.replace(old, new))
          PY

      - name: Patch vold gatekeeper diagnostics for NX809J
        run: |
          set -e
          cat > /tmp/nf12_gk_block.cpp <<'CPP'
                  AidlGatekeeperVerifyResp rsp;
                  {
                      const unsigned char* hp = static_cast<const unsigned char*>(password_handle);
                      unsigned long long sid64 = 0;
                      if (handle_len >= 9)
                          for (int i = 7; i >= 0; --i) sid64 = (sid64 << 8) | hp[1 + i];
                      printf("GKREQ handle_len=%zu sidField=%llu fakeUid=%llu\n",
                             handle_len, sid64, (unsigned long long)fakeUid(user_id));
                      printf("GKREQ handle_hex=");
                      for (size_t i = 0; i < handle_len && i < 58; i++) printf("%02x", hp[i]);
                      printf("\nGKREQ gkpwd_hex=");
                      for (int i = 0; i < 32; i++)
                          printf("%02x", ((const unsigned char*)gk_pwd_token)[i]);
                      printf("\n");
                  }
                  bool gk_ok = false;
                  auto gk_try = [&](int uid_try, const char* tag) {
                      auto res = aidl_gk_device->verify(uid_try, 0, pwd_handle_hidl,
                                                        gk_pwd_token_hidl, &rsp);
                      if (res.isOk()) {
                          printf("GKTRY %s uid=%d OK statusCode=%d\n", tag, uid_try, (int)rsp.statusCode);
                          return true;
                      }
                      printf("GKTRY %s uid=%d FAIL exc=%d svc=%d\n", tag, uid_try,
                             (int)res.getExceptionCode(), (int)res.getServiceSpecificError());
                      return false;
                  };
                  gk_ok = gk_try((int)fakeUid(user_id), "asis");
                  if (!gk_ok) {
                      uid_t saved_euid = geteuid();
                      if (seteuid(1000) == 0) {
                          gk_ok = gk_try((int)fakeUid(user_id), "euid1000");
                          seteuid(saved_euid);
                      } else {
                          printf("GKTRY euid1000 seteuid failed\n");
                      }
                      if (!gk_ok) gk_ok = gk_try(1000, "uid1000");
                      if (!gk_ok) gk_ok = gk_try(0, "uid0");
                  }
                  free(gk_pwd_token);
                  if (!gk_ok) {
                      printf("GKFAIL all-attempts-failed\n");
                      return true;
                  }
          CPP
          python3 - <<'PY'
          import re
          from pathlib import Path

          dec = Path("system/vold/Decrypt.cpp")
          text = dec.read_text()
          block = Path("/tmp/nf12_gk_block.cpp").read_text().rstrip("\n") + "\n"

          if "#include <unistd.h>" not in text:
              mi = re.search(r'^#include [<"].*?[>"]\n', text, re.M)
              if mi is None:
                  raise SystemExit("no #include anchor for unistd.h")
              text = text[:mi.end()] + "#include <unistd.h>\n" + text[mi.end():]

          anchor = "    // Optional trailing pin length, absent on old protectors"
          if anchor not in text:
              raise SystemExit("Get_Password_Data anchor not found")
          if "GKPWD len=" not in text:
              dump = (
                  '    printf("GKPWD len=%zu credType=%d logN=%u logR=%u logP=%u saltLen=%d handleLen=%d\\n",\n'
                  '           pwd_data.size(), pwd->credential_type, (unsigned)pwd->scrypt_log_n,\n'
                  '           (unsigned)pwd->scrypt_log_r, (unsigned)pwd->scrypt_log_p,\n'
                  '           pwd->salt_len, pwd->handle_len);\n'
                  '    printf("GKPWD salt_hex=");\n'
                  '    for (int i = 0; i < pwd->salt_len && i < 32; i++)\n'
                  '        printf("%02x", ((const unsigned char*)pwd->salt)[i]);\n'
                  '    printf("\\n");\n'
              )
              text = text.replace(anchor, dump + anchor, 1)

          pat = re.compile(
              r'[ \t]*AidlGatekeeperVerifyResp rsp;\s*'
              r'const auto result = aidl_gk_device->verify\(.*?\);\s*'
              r'free\(gk_pwd_token\);\s*'
              r'if \(!result\.isOk\(\)\) \{\s*'
              r'printf\("gatekeeper verification failed\\n"\);\s*'
              r'return false;\s*\}', re.S)
          m = pat.search(text)
          if m is None:
              raise SystemExit("verify block not found, occurrences=" +
                               str(text.count("gatekeeper verification failed")))
          text = text[:m.start()] + block + text[m.end():]
          dec.write_text(text)

          if text.count("GKPWD len=") != 1:
              raise SystemExit("GKPWD marker count wrong")
          if text.count("GKREQ handle_len=") != 1:
              raise SystemExit("GKREQ marker count wrong")
          if text.count("GKFAIL all-attempts-failed") != 1:
              raise SystemExit("GKFAIL marker count wrong")
          if "const auto result" in text:
              raise SystemExit("old verify call still present")
          print("vold patched: GKPWD / GKREQ / GKTRY / GKFAIL markers ok")
          PY

      - name: Patch gui2 extra tools for NX809J
        run: |
          set -e
          python3 - <<'PY'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """Patch TWRP gui2 to add the extra tools page (home card + 进阶功能 pages).

          v2 (2026-11-19) changes, on top of the first version:
            * 安装 OTA 包  -> 先在 /sdcard 里浏览、选一个 zip / payload.bin，
                             再勾选要写入的物理分区，确认后才执行。
            * 备份分区     -> 列出 by-name 里的物理分区，勾选多个，确认后打包备份，
                             备份完在控制台打印每个分区的 md5 与回读校对结果。
            * 还原分区     -> 可以在 /sdcard 下任意浏览文件夹（不只 TWRP/BF*），
                             选中文件夹后勾选要写回的 .img，确认后还原并做 md5 校对。
            * 其余功能（9008 / 关闭模组 / 一键 root / 导出日志）保持一键执行。

          Rows of the top page still come from /sdcard/TWRP/nf_menu.conf, so later items
          (7, 8, 9 ...) can be added by editing that text file instead of rebuilding.

          Usage: nf_gui2_patch.py [recovery_source_root]   (default: bootable/recovery)

          Every edit is an exact-match replacement with an assertion, so a moved anchor
          fails the build immediately instead of producing a silently wrong binary.
          """
          import os
          import sys

          ROOT = sys.argv[1] if len(sys.argv) > 1 else "bootable/recovery"
          GUI = os.path.join(ROOT, "gui2")


          def edit(rel, pairs):
              path = os.path.join(GUI, rel)
              with open(path, "r", encoding="utf-8") as handle:
                  text = handle.read()
              for index, (old, new) in enumerate(pairs):
                  if old not in text:
                      raise SystemExit("anchor %d missing in %s:\n%s" % (index, rel, old))
                  text = text.replace(old, new, 1)
              with open(path, "w", encoding="utf-8") as handle:
                  handle.write(text)
              print("patched %d edit(s) in %s" % (len(pairs), rel))


          # ---------------------------------------------------------------- home card ---
          edit(
              "pages/home_page.h",
              [(
                  """  const char* notice_text = nullptr;
            lv_event_cb_t notice_event_callback = nullptr;
          };""",
                  """  const char* notice_text = nullptr;
            lv_event_cb_t notice_event_callback = nullptr;
            // One extra card after the built-in ones. The target comes back as the event
            // user data of extra_event_callback, which is what lets a device build add
            // its own tools without touching the shared action table.
            const char* extra_title = nullptr;
            const void* extra_target = nullptr;
            lv_event_cb_t extra_event_callback = nullptr;
          };""",
              )],
          )

          edit(
              "pages/home_page.cpp",
              [(
                  """  for (size_t i = 0; i < options.action_count; ++i) {
              create_action_card(options, cards, options.actions[i], card_width, metrics.card_height,
                                 metrics.icon_size);
            }""",
                  """  for (size_t i = 0; i < options.action_count; ++i) {
              create_action_card(options, cards, options.actions[i], card_width, metrics.card_height,
                                 metrics.icon_size);
            }
            if (options.extra_title != nullptr && options.extra_event_callback != nullptr) {
              gui2_components::icon_card_options card;
              card.metrics = options.metrics;
              card.icon = &kGui2IconAdvanced;
              card.icon_color = 0x9AA7B0;
              card.title = options.extra_title;
              card.width = card_width;
              card.height = metrics.card_height;
              card.icon_size = metrics.icon_size;
              card.event_callback = options.extra_event_callback;
              card.user_data = options.extra_target;
              card.press_guard_callback = options.press_guard_callback;
              gui2_components::create_icon_card(cards, card);
            }""",
              )],
          )

          # ------------------------------------------------------------- page routing ---
          edit(
              "pages/page_router.h",
              [(
                  """  TOOL_INPUT,
          };""",
                  """  TOOL_INPUT,
            NF_TOOLS,
          };""",
              )],
          )

          # ------------------------------------------------------------ tools page api ---
          edit(
              "pages/tool_pages.h",
              [(
                  """void build_confirm_page(const confirm_page_options& options);

          }  // namespace gui2_pages""",
                  """void build_confirm_page(const confirm_page_options& options);

          // The device's own extra tools: one row per line of its menu file. The target
          // is handed straight back as the event user data.
          struct nf_menu_entry {
            const char* title = nullptr;
            const char* detail = nullptr;
            const void* target = nullptr;
          };
          struct nf_tools_page_options {
            lv_obj_t* content = nullptr;
            const gui2_core::ui_metrics* metrics = nullptr;
            lv_event_cb_t event_callback = nullptr;
            lv_event_cb_t press_guard_callback = nullptr;
            const nf_menu_entry* items = nullptr;
            size_t item_count = 0;
          };
          void build_nf_tools_page(const nf_tools_page_options& options);
          }  // namespace gui2_pages""",
              )],
          )

          edit(
              "pages/tool_pages.cpp",
              [(
                  """  gui2_components::create_tip_card(body, metrics, options.text, text, surface);
          }

          }  // namespace gui2_pages""",
                  """  gui2_components::create_tip_card(body, metrics, options.text, text, surface);
          }

          void build_nf_tools_page(const nf_tools_page_options& options) {
            if (options.content == nullptr || options.metrics == nullptr || options.items == nullptr)
              return;
            const auto& metrics = *options.metrics;
            lv_obj_t* body = create_body(options.content, metrics);
            for (size_t i = 0; i < options.item_count; ++i) {
              const auto& item = options.items[i];
              gui2_components::create_setting_card(body, metrics, item.title, item.detail,
                                                   options.event_callback, item.target,
                                                   options.press_guard_callback);
            }
          }

          }  // namespace gui2_pages""",
              )],
          )

          # ------------------------------------------------------------------ gui2.cpp ---
          edit(
              "gui2.cpp",
              [
                  # extra includes for the directory scan and string building
                  (
                      """#include <unistd.h>""",
                      """#include <unistd.h>
          #include <dirent.h>
          #include <sys/stat.h>
          #include <cstdio>
          #include <cstring>
          #include <algorithm>""",
                  ),
                  # forward declarations
                  (
                      """static void open_advanced_tool(settings_target target);""",
                      """static void open_advanced_tool(settings_target target);
          static void open_nf_main_menu(page_transition transition);
          static void show_nf_tools_page(page_transition transition);
          static void nf_row_event_cb(lv_event_t* event);
          static void nf_refresh_current(void);
          static void nf_refresh_or_back(void);""",
                  ),
                  # the menu state, declared before any page code can read it
                  (
                      """static bool home_page_active;
          static bool home_navigation_active;""",
                      """static bool home_page_active;
          static bool home_navigation_active;
          // ---- Extra tools state ------------------------------------------------------
          struct nf_menu_item {
            std::string title;
            std::string detail;
            std::string command;
          };
          static std::vector<nf_menu_item> nf_menu;
